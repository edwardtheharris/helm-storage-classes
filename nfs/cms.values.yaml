externalSnapshotter:
  enabled: true
controller:
  runOnControlPlane: true
  replicas: 1
storageClasses:
  - name: nfs-delete
    annotations:
      storageclass.kubernetes.io/is-default-class: "false"
    parameters:
      server: thw00b
      share: /srv/nfs/cms
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    mountOptions:
      - nfsvers=4.1
  - name: nfs
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
    parameters:
      server: thw00b
      share: /srv/nfs/cms
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    mountOptions:
      - nfsvers=4.1
  - name: media
    annotations:
      storageclass.kubernetes.io/is-default-class: "false"
    parameters:
      server: media01
      share: /srv/media
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    mountOptions:
      - nfsvers=4.1
